services:
  postgres:
    image: postgres:16
    container_name: xhs_growth_postgres
    restart: always
    environment:
      POSTGRES_DB: xhs_growth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - xhs_growth_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: xhs_growth_backend
    depends_on:
      - postgres
    environment:
      APP_ENV: dev
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/xhs_growth
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: xhs_growth_frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: /
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - xhs_growth_frontend_node_modules:/app/frontend/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  xhs_growth_pg_data:
  xhs_growth_frontend_node_modules:
