services:
  postgres:
    image: postgres:16
    container_name: xhs_growth_postgres
    restart: always
    environment:
      POSTGRES_DB: xhs_growth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - xhs_growth_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: xhs_growth_backend
    depends_on:
      - postgres
    environment:
      APP_ENV: dev
      DEBUG: "true"
      AGENT_ENTRY_MODE: ${AGENT_ENTRY_MODE:-conversation_v2}
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/xhs_growth
      LLM_PROVIDER: ${LLM_PROVIDER:-qwen}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_CONTROL_SEMANTIC_MODEL: ${LLM_CONTROL_SEMANTIC_MODEL:-}
      AGENT_WORKFLOW_TOOL_TIMEOUT_SECONDS: ${AGENT_WORKFLOW_TOOL_TIMEOUT_SECONDS:-150}
      LLM_RESEARCH_ANALYSIS_MODEL: ${LLM_RESEARCH_ANALYSIS_MODEL:-qwen3.7-flash-2026-07-15}
      LLM_RESEARCH_ANALYSIS_TIMEOUT_SECONDS: ${LLM_RESEARCH_ANALYSIS_TIMEOUT_SECONDS:-120}
      LLM_CONTENT_STRATEGY_TIMEOUT_SECONDS: ${LLM_CONTENT_STRATEGY_TIMEOUT_SECONDS:-120}
      LLM_DRAFT_GENERATION_TIMEOUT_SECONDS: ${LLM_DRAFT_GENERATION_TIMEOUT_SECONDS:-120}
      LLM_DRAFT_REVIEW_MODEL: ${LLM_DRAFT_REVIEW_MODEL:-qwen3.7-flash-2026-07-15}
      LLM_DRAFT_REVIEW_TIMEOUT_SECONDS: ${LLM_DRAFT_REVIEW_TIMEOUT_SECONDS:-120}
      LLM_RESEARCH_ANALYSIS_ENABLE_THINKING: ${LLM_RESEARCH_ANALYSIS_ENABLE_THINKING:-false}
      LLM_POST_PUBLISH_REVIEW_MODEL: ${LLM_POST_PUBLISH_REVIEW_MODEL:-qwen3.7-flash-2026-07-15}
      LLM_POST_PUBLISH_REVIEW_TIMEOUT_SECONDS: ${LLM_POST_PUBLISH_REVIEW_TIMEOUT_SECONDS:-120}
      LLM_POST_PUBLISH_REVIEW_ENABLE_THINKING: ${LLM_POST_PUBLISH_REVIEW_ENABLE_THINKING:-false}
      LLM_DRAFT_REVISION_MODEL: ${LLM_DRAFT_REVISION_MODEL:-qwen3.7-flash-2026-07-15}
      LLM_DRAFT_REVISION_TIMEOUT_SECONDS: ${LLM_DRAFT_REVISION_TIMEOUT_SECONDS:-120}
      LLM_DRAFT_REVISION_ENABLE_THINKING: ${LLM_DRAFT_REVISION_ENABLE_THINKING:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      XHS_MCP_BASE_URL: ${XHS_MCP_BASE_URL:-http://host.docker.internal:18060}
      XHS_MCP_HOST_HEADER: ${XHS_MCP_HOST_HEADER:-localhost:18060}
      XHS_MCP_TIMEOUT_SECONDS: ${XHS_MCP_TIMEOUT_SECONDS:-60}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: xhs_growth_frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: /
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - xhs_growth_frontend_node_modules:/app/frontend/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  xhs_growth_pg_data:
  xhs_growth_frontend_node_modules:
